    <text font-family="Arial,sans-serif" font-size="3.6" x="18" y="21">130 x 75 mm nominal pillow body (oval depth; closure curvature trial required)</text>
    <text font-family="Arial,sans-serif" font-size="3" x="18" y="27">REVISED_SAMPLE_REQUIRED | STRUCTURAL_DIELINE</text>
    <text font-family="Arial,sans-serif" font-size="2.6" x="18" y="87.5">Revision V5 - double face curved score closure and narrow side glue seam | VECTOR PROTOTYPE ONLY; verify material c</text>
    <text font-family="Arial,sans-serif" font-size="2.6" x="18" y="91.5">aliper, fold allowance, tooling and assembly with converter. | Score arc radius should be proofed at selected calip</text>
