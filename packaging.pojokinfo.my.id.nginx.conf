server {
    listen 80;
    listen [::]:80;
    server_name packaging.pojokinfo.my.id;

    root /var/www/packaging.pojokinfo.my.id;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|hdr|glb)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
